<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index4.js</title>
</head>
<body>
    <script>
     var x = parseInt(prompt("Digite um numero: "))

    var resultado = 0;

    for (var i = 1; i <= x; i++) {
        resultado += i;
    }
    
    alert(resultado)

    </script>
</body>
</html>
