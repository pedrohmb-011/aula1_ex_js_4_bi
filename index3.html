<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index3.js</title>
</head>
<body>
    <script>
        var n1 = parseInt(prompt("digite um numero: "))
         
        if (n1 > 0){
            alert("positivo")
        }
        else if (n1 == 0){
            alert("Seu numero e zero")
        }
        else if (n1 < 0) {
            ("negativo. ")
        }
        else{
            ("Você digitou errado. ")
        }
    </script>
</body>
</html>
