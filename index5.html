<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index5.js</title>
</head>
<body>
    <script>
        var x = parseInt(prompt("digite um numero interiro: "))

        if(x == 2 || x == 3 || x == 5){
            alert("Seu número é primo. ")
        }
        else if (x % 2 == 0 || x % 3 == 0 || x % 5 == 0){
            alert("Seu número não é primo. ")
        }
        else{
            alert("Seu número é primo. ")
        }
    </script>
</body>
</html>
