<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index.2</title>
</head>
<body>
    <script>
        var n1 = parseFloat(prompt("digite um numero: "))
        var n2 = parseFloat(prompt("digite o segundo numero: "))
        var n3 = parseFloat(prompt("digite o terceiro numero: "))

        if(n1 > n2 && n1 > n3){
            alert(n1 + " e maior que " + n2 + " e " + n3)
        }
        else if (n2 > n1 && n2 > n3){
            alert(n2 + " e maior que " + n1 + " e " + n3)
        }
        else if(n3 > n1 && n3 > n2) {
            alert(n3 + " e maior que " + n1 + " e " + n2)
        }
        else(n1 == n2 && n2 == n3); {
            alert("Todos numeros sao iguais. ")
        }
        
    </script>
</body>
</html>
